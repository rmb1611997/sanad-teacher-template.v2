# SANAD Teacher — backend-v2 (plain PHP, no framework) — Nginx production config.
#
# Single-teacher deployment: one server block serves one backend-v2 instance.
# Copy this into /etc/nginx/sites-available/sanad-teacher-api.conf, adjust the
# marked placeholders, symlink into sites-enabled, then `nginx -t && systemctl reload nginx`.
#
# Assumes PHP-FPM is running and listening on the socket/port set in
# `fastcgi_pass` below — adjust to match your php-fpm pool (check
# `/etc/php/*/fpm/pool.d/www.conf` -> `listen = ...`).

server {
    listen 80;
    listen [::]:80;

    # ---- CHANGE ME ----
    server_name api.yourdomain.com;

    # Document root MUST be backend/public — never the backend/ root. Everything
    # else (app/, config/, database/, storage/, vendor/, .env) lives one level
    # above this and is therefore not reachable by Nginx no matter what URL is
    # requested, since Nginx only ever resolves paths under `root`.
    # ---- CHANGE ME ----
    root /var/www/sanad-teacher/backend/public;

    index index.php;

    charset utf-8;
    client_max_body_size 12m; # a little above the app's 10MB upload cap

    access_log /var/log/nginx/sanad-teacher-access.log;
    error_log  /var/log/nginx/sanad-teacher-error.log;

    # ---- Security headers for anything Nginx serves directly (static files,
    # or an error page returned before PHP is ever reached) ----
    # NOTE: these are intentionally NOT set server-wide. Every PHP response
    # already carries X-Content-Type-Options / X-Frame-Options / Referrer-Policy
    # / Content-Security-Policy from app/Middleware/Cors.php — adding them again
    # here at server level would just duplicate the same header on every API
    # response. They're scoped to the /uploads/ and static-asset locations below
    # instead, which are served by Nginx alone and never touch PHP.

    # ---- Block dotfiles (.env, .git, .htaccess, etc.) outright ----
    location ~ /\. {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        deny all;
        return 404;
    }

    # ---- Uploads: static files only, PHP execution explicitly disabled ----
    # Belt-and-braces alongside public/uploads/.htaccess (which only matters
    # under Apache) and the extension/MIME allow-list enforced in
    # UploadController — even if a disallowed file ever ends up in this
    # directory, Nginx will never hand it to PHP-FPM.
    location ^~ /uploads/ {
        location ~* \.(php|phtml|php[0-9]|phar|pht)$ {
            add_header X-Content-Type-Options "nosniff" always;
            deny all;
            return 403;
        }

        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    # ---- Other static assets (if any get served from public/ directly) ----
    location ~* \.(?:jpg|jpeg|png|gif|webp|svg|ico|css|js|woff2?|ttf)$ {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    # ---- Front controller: every other request that isn't a real file/dir
    # goes to index.php, exactly like the existing Apache .htaccess:
    #   RewriteCond %{REQUEST_FILENAME} !-f
    #   RewriteCond %{REQUEST_FILENAME} !-d
    #   RewriteRule ^ index.php [QSA,L]
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ---- PHP-FPM ----
    location ~ ^/index\.php$ {
        include fastcgi_params;
        # ---- CHANGE ME: match your php-fpm pool's `listen` directive ----
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        # fastcgi_pass 127.0.0.1:9000; # alternative if using TCP instead of a socket

        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Never let PHP-FPM execute a file outside of index.php itself,
        # regardless of the requested URL — the app has a single front
        # controller, there is no other legitimate PHP entry point under
        # public/.
        internal;
    }

    # Any other *.php request (e.g. someone probing /uploads/x.php,
    # /wp-admin/setup.php, etc.) is refused outright, never handed to PHP-FPM.
    location ~ \.php$ {
        deny all;
        return 403;
    }
}

